[tool.poetry]
name = "jarvis"
version = "0.1.0"
description = "JARVIS AI Runtime — Enterprise-grade AI reasoning engine for indexed code repositories."
authors = ["Vidit Jain <team@jarvis.dev>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"

# ── Web Framework ──────────────────────────────────────────────────────
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
httpx = "^0.27.0"

# ── AI / LangGraph ─────────────────────────────────────────────────────
langgraph = "^0.1.0"
langchain = "^0.2.0"
langchain-openai = "^0.1.0"
langchain-community = "^0.2.0"
openai = "^1.35.0"

# ── Data Validation ────────────────────────────────────────────────────
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

# ── Databases ─────────────────────────────────────────────────────────
neo4j = "^5.21.0"
pymilvus = "^2.4.0"

# ── Auditing & Infrastructure ─────────────────────────────────────────
google-cloud-bigquery = "^3.25.0"

# ── Observability ─────────────────────────────────────────────────────
structlog = "^24.2.0"

# ── Configuration ─────────────────────────────────────────────────────
pyyaml = "^6.0.1"
python-dotenv = "^1.0.1"

# ── Utilities ─────────────────────────────────────────────────────────
typing-extensions = "^4.12.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"

# Code Quality
ruff = "^0.4.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"

# Type Stubs
types-pyyaml = "^6.0.12"

[tool.poetry.scripts]
jarvis = "app:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── Ruff Configuration ────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "ANN401",  # Dynamically typed expressions (typing.Any)
    "B008",    # Do not perform function calls in default arguments (Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]
"application/nodes/*.py" = ["ANN"]

# ── MyPy Configuration ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "neo4j.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymilvus.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

# ── Pytest Configuration ──────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html",
    "--cov-fail-under=80",
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ── Coverage Configuration ────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/migrations/*",
    "configs/*",
    "docs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
